appId: ai.closedloop.desktop
productName: Closedloop

# Debian package metadata requires a homepage; apply it to the staged manifest.
extraMetadata:
  homepage: https://closedloop.ai

# ISS-6109: the OS-level custom URI scheme the web app's onboarding download
# step and Desktop handback fire. electron-builder reads this block for exactly two of the
# platforms we care about — macOS `CFBundleURLTypes` in Info.plist and the Linux
# .desktop `MimeType` (plus the Windows AppX target, which we do not build).
# NSIS/Squirrel ignore it, so WINDOWS registration comes solely from the runtime
# `app.setAsDefaultProtocolClient` call in src/main/lifecycle/deep-link.ts.
# On macOS that runtime call can only succeed for a bundle whose Info.plist
# already declares the scheme, so for the target we actually ship (mac dmg+zip)
# this block is load-bearing and not a duplicate of the runtime call.
# The scheme name is the shared DESKTOP_DEEP_LINK_SCHEME wire constant
# (packages/api/src/types/desktop-deep-link.ts) — YAML cannot import it, so a
# change there must be mirrored here.
# Only the bare, payload-free `closedloop://` is ever accepted; the handler
# denies every URL carrying a host, path, query, fragment, or credentials.
protocols:
  - name: Closedloop
    schemes:
      - closedloop
    role: Viewer

files:
  - app/**/*
  - package.json

beforeBuild: ./scripts/use-staged-node-modules.mjs
# ISS-12185: appends the hidden-file positions to dmg.contents below.
beforePack: ./scripts/dmg-hidden-files.mjs

extraResources:
  - from: resources/icon-1024.png
    to: icon-1024.png
  - from: resources/trayIconTemplate.png
    to: trayIconTemplate.png
  - from: resources/trayIconTemplate@2x.png
    to: trayIconTemplate@2x.png
  # First-party agent-monitor hook handlers (FEA-1503), shipped unpacked outside
  # the asar so they resolve as real files. agent-monitor-hooks.ts copies them
  # into userData at install time; the installed hook command runs them via the
  # Electron binary as Node (ELECTRON_RUN_AS_NODE) against that userData copy.
  - from: resources/hooks
    to: hooks
    filter:
      - "*.js"
  # First-party statusline capture script (FEA-3492), shipped unpacked outside
  # the asar so it resolves as a real file. statusline-capture-install.ts copies
  # it into userData at opt-in time; the installed statusLine command runs it via
  # the Electron binary as Node (ELECTRON_RUN_AS_NODE) against that userData copy.
  - from: resources/statusline
    to: statusline
    filter:
      - "*.js"
  # Bundled coaching packs (overridable best-practice signal sets for Agent
  # Coaching Tips). agent-coaching-packs.ts seeds these into userData on first
  # run and the active pack's signals replace the built-in defaults.
  - from: resources/coaching-packs
    to: coaching-packs
    filter:
      - "**/*"

mac:
  icon: resources/icon.icns
  target:
    - target: dmg
      arch:
        - universal
    - target: zip
      arch:
        - universal
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true

dmg:
  # ISS-12185: the app and the /Applications link sit on the arrow in
  # build/background.png, which dmg-builder picks up by name. That image is
  # dmg-builder's default background with the arrow moved up to y=175, the
  # middle of the window below its title bar (32pt on macOS 26, 28 before).
  # Listed explicitly so the beforePack hook has a list to extend.
  contents:
    - x: 130
      y: 175
      type: file
    - x: 410
      y: 175
      type: link
      path: /Applications

linux:
  executableName: closedloop
  icon: resources/icon-1024.png
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  artifactName: Closedloop-${version}-linux-x64.${ext}
  category: Development

deb:
  packageName: closedloop

publish:
  provider: generic
  # Packaged clients read the public API updater feed. The API authenticates
  # to GitHub server-side and serves only Desktop updater metadata/assets.
  url: https://api.closedloop.ai/desktop/updates
  # ISS-10424: one byte range per request. electron-updater otherwise packs up
  # to 1000 ranges into each differential request, and the GitHub release-asset
  # CDN the API redirects to answers a multi-range request with
  # `501 Unsupported client range` (probed 2026-09-16), which fails every
  # differential download back to a full one. Baked into app-update.yml, so it
  # takes effect for installs built after this line.
  #
  # Known ceiling, measured 2026-09-16: on the first 302 electron-updater's
  # DifferentialDownloader rewrites its shared requestOptions to the redirect
  # target and reuses that ONE signed release-assets URL for every remaining
  # range, so only range #1 touches the API route and the whole download rides a
  # single short-lived signature. Probing one returned 206 at 390 s and had
  # lapsed by 990 s, so the window is somewhere in 6.5-16.5 min. A differential
  # run slower than that loses the signature partway through and electron-
  # updater falls back to the full download it would have done anyway — slower
  # than today, never broken.
  useMultipleRangeRequest: false

directories:
  output: dist-dmg
