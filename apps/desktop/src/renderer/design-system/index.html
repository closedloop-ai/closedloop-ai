<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Closedloop</title>
    <style>
    html,
    body,
    #root {
      min-height: 100%;
      margin: 0;
    }

    body {
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    /*
     * Splash palette. These are the design-system LIGHT-theme token values
     * copied literally out of `packages/design-system/styles/globals.css`
     * (`:root` `--background` / `--foreground` / `--muted-foreground`), not an
     * independently chosen palette: the splash paints before any stylesheet
     * loads, so it cannot read `var(--background)` and has to carry the value.
     *
     * Light, not the previous hardcoded dark `#0f1723`, because the mounted app
     * resolves to LIGHT by default — `main.tsx` passes `defaultTheme="light"` to
     * `DesignSystemProvider` — so a dark splash guaranteed a dark-then-light
     * flash on every default-theme boot. A user who has explicitly switched the
     * app to dark still gets a light splash for the hold, because the stored
     * theme preference is only readable once the renderer's JS runs; that is the
     * rarer mismatch of the two, and it is the closest match reachable here.
     *
     * MUST stay scoped to the loading shell, never on <body>. This <style> is
     * unlayered, and unlayered CSS wins over @layer, so a `body { color }` here
     * would override the design-system's layered
     * `@layer base { body { … var(--foreground) } }` tokens and pin the mounted
     * React app to the splash palette (the FEA-4047 regression). Keeping it on
     * .initial-shell means the theme tokens govern once the app mounts and
     * replaces #root.
     */
    .initial-shell {
      display: grid;
      min-height: 100vh;
      place-items: center;
      background: oklch(0.989 0 0);
      color: oklch(0.232 0 0);
    }

    .initial-shell__panel {
      display: grid;
      gap: 12px;
      justify-items: center;
    }

    /*
     * The spinner has to actually spin. Its only reachable moments are a user
     * opening the app mid-boot and the bounded reveal fail-open (ISS-5346) —
     * i.e. exactly the "did this hang?" moment — and a frozen ring answers yes.
     * This <style> block is standalone (globals.css is not loaded yet), so the
     * keyframes and the reduced-motion guard both have to live here.
     */
    .initial-shell__mark {
      width: 28px;
      height: 28px;
      border: 2px solid oklch(0.232 0 0 / 0.15);
      border-top-color: oklch(0.232 0 0 / 0.7);
      border-radius: 999px;
      animation: initial-shell-spin 900ms linear infinite;
    }

    @keyframes initial-shell-spin {
      to {
        transform: rotate(1turn);
      }
    }

    @keyframes initial-shell-pulse {
      50% {
        opacity: 0.25;
      }
    }

    /*
     * Reduced motion drops the rotation, but must not leave a static ring with a
     * lighter top segment — that reads as a stalled spinner, the exact wrong
     * answer. Even out the border and pulse the opacity instead, which still
     * says "working" without vestibular motion.
     */
    @media (prefers-reduced-motion: reduce) {
      .initial-shell__mark {
        border-color: oklch(0.232 0 0 / 0.3);
        animation: initial-shell-pulse 1600ms ease-in-out infinite;
      }
    }

    .initial-shell__status {
      color: oklch(0.466 0 0);
      font-size: 13px;
    }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="initial-shell">
        <div class="initial-shell__panel">
          <div aria-hidden="true" class="initial-shell__mark"></div>
          <div class="initial-shell__status" role="status">Starting Closedloop</div>
        </div>
      </div>
    </div>
    <script src="./renderer-ready-signal.ts" type="module"></script>
    <script src="../main.tsx" type="module"></script>
  </body>
</html>
